<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小偵探事務所｜福爾摩斯與亞森羅蘋</title>
<style>
  :root {
    color-scheme: dark;
    --night:#161C36; --night2:#0E1327; --lamp:#F4C95D; --lamp-d:#C99A2E;
    --paper:#F7EEDA; --paper-d:#E6D5B2; --ink:#241C17; --ink-soft:#6A5A4B;
    --holmes:#2F7F86; --holmes-d:#1F5A60; --lupin:#7A3FA8; --lupin-d:#552B78;
    --red:#C23B33; --green:#3E9B5E;
    --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
    --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  }
  * { box-sizing:border-box }
  html, body { height:100%; margin:0 }
  body {
    background:radial-gradient(120% 70% at 50% 0%, #2A3566 0%, var(--night) 45%, var(--night2) 100%) fixed;
    color:var(--paper); font-family:var(--f-body); font-weight:500; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  [hidden] { display:none !important }
  .wrap { max-width:520px; margin:0 auto; padding:16px 16px 48px }
  ruby { ruby-position:over }
  rt { font-size:.42em; font-weight:500; letter-spacing:0; line-height:1.1; opacity:.85 }
  button { font-family:inherit }

  /* ---------- 按鈕 ---------- */
  .btn {
    appearance:none; border:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    min-height:64px; padding:6px 30px; border-radius:999px;
    background:linear-gradient(180deg, var(--lamp), var(--lamp-d)); color:#3A2606;
    font-size:24px; font-weight:900; letter-spacing:.1em;
    box-shadow:0 6px 0 #8A6314, 0 10px 22px rgba(0,0,0,.35);
    transition:transform .1s, box-shadow .1s;
  }
  .btn:active { transform:translateY(5px); box-shadow:0 1px 0 #8A6314, 0 4px 10px rgba(0,0,0,.3) }
  .btn.quiet { background:rgba(247,238,218,.12); color:var(--paper); box-shadow:0 4px 0 rgba(0,0,0,.3); font-size:18px; min-height:48px; padding:4px 20px }
  .btn:focus-visible, .card:focus-visible, .item:focus-visible, .opt:focus-visible { outline:4px solid #fff; outline-offset:3px }
  .icon-btn {
    appearance:none; border:0; cursor:pointer; width:48px; height:48px; border-radius:50%;
    background:rgba(247,238,218,.14); color:var(--paper); font-size:22px; display:grid; place-items:center;
  }
  .icon-btn.speaking { background:var(--lamp); color:#3A2606 }

  /* ---------- 首頁 ---------- */
  .cover { text-align:center; padding-top:8px }
  .cover h1 {
    font-family:var(--f-display); font-weight:900; font-size:clamp(44px,13vw,64px); line-height:1.05; margin:4px 0 0;
    color:var(--lamp); text-shadow:0 3px 0 #7A5410, 0 0 30px rgba(244,201,93,.35); letter-spacing:.06em;
  }
  .cover h1 rt { font-size:.26em; color:var(--paper); text-shadow:none }
  .cover .sub { font-size:19px; letter-spacing:.3em; margin:10px 0 0; opacity:.9 }
  .heroes { display:flex; justify-content:center; gap:10px; margin:14px 0 6px }
  .heroes svg { width:42%; max-width:190px; height:auto }
  .cases { display:grid; gap:12px; margin-top:12px }
  .card {
    appearance:none; border:0; text-align:left; cursor:pointer; width:100%;
    display:grid; grid-template-columns:56px 1fr auto; align-items:center; gap:14px;
    background:var(--paper); color:var(--ink); border-radius:20px; padding:14px 16px;
    box-shadow:0 5px 0 var(--paper-d), 0 10px 20px rgba(0,0,0,.3);
    transition:transform .1s;
  }
  .card:active { transform:translateY(3px) }
  .card .no { width:56px; height:56px; border-radius:16px; display:grid; place-items:center; font-size:30px; color:#fff; font-weight:900; font-family:var(--f-display) }
  .card.h .no { background:var(--holmes) }
  .card.l .no { background:var(--lupin) }
  .card .ti { font-family:var(--f-display); font-weight:900; font-size:25px; line-height:1.5 }
  .card .ti rt { color:var(--ink-soft) }
  .card .tag { font-size:14px; font-weight:700; color:var(--ink-soft); margin-top:2px }
  .card .st { font-size:30px }

  /* ---------- 案件畫面 ---------- */
  .bar { display:flex; align-items:center; gap:10px; margin-bottom:12px }
  .dots { flex:1; display:flex; gap:6px; justify-content:center; flex-wrap:wrap }
  .dots i { width:12px; height:12px; border-radius:50%; background:rgba(247,238,218,.22) }
  .dots i.on { background:var(--lamp) }
  .dots i.cur { background:var(--paper); box-shadow:0 0 0 3px rgba(244,201,93,.55) }

  .art {
    border-radius:24px; min-height:190px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:6px 14px; padding:18px; font-size:64px; line-height:1.15; position:relative; overflow:hidden;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.12), 0 10px 24px rgba(0,0,0,.3);
  }
  .art span { filter:drop-shadow(0 4px 4px rgba(0,0,0,.3)); animation:bob 3s ease-in-out infinite }
  .art span:nth-child(2n) { animation-delay:-1.2s }
  .art span:nth-child(3n) { animation-delay:-2s }
  @keyframes bob { 50% { transform:translateY(-6px) } }
  .bg-night  { background:linear-gradient(180deg,#26305E,#10162E) }
  .bg-rain   { background:linear-gradient(180deg,#566384,#2A3350) }
  .bg-day    { background:linear-gradient(180deg,#8FD0EE,#F6EBC6) }
  .bg-barn   { background:linear-gradient(180deg,#F2C47A,#B5703A) }
  .bg-market { background:linear-gradient(180deg,#FFE9B0,#E5A55A) }
  .bg-sea    { background:linear-gradient(180deg,#7CC4E8,#2D6F9E) }
  .bg-ship   { background:linear-gradient(180deg,#3B5C8F,#17284A) }
  .bg-vault  { background:linear-gradient(180deg,#3A2850,#150D22) }
  .bg-study  { background:linear-gradient(180deg,#3a5a46,#2a1a10) }
  .bg-hall   { background:linear-gradient(180deg,#8a8478,#4a4036) }

  .speech {
    margin-top:14px; background:var(--paper); color:var(--ink); border-radius:22px; padding:16px 18px;
    display:grid; grid-template-columns:64px 1fr; gap:14px; align-items:center;
    box-shadow:0 5px 0 var(--paper-d), 0 10px 22px rgba(0,0,0,.3);
  }
  .who { width:64px; height:64px; border-radius:50%; overflow:hidden; background:#EBD9B4; display:grid; place-items:center; font-size:36px }
  .who svg { width:100%; height:100% }
  .line { font-family:var(--f-display); font-weight:700; font-size:26px; line-height:2; min-height:3.2em; display:block; align-self:center; overflow-wrap:anywhere }
  .line rt { color:var(--ink-soft) }
  .next { display:flex; justify-content:center; gap:12px; margin-top:18px }

  /* ---------- 互動區 ---------- */
  .prompt {
    background:var(--paper); color:var(--ink); border-radius:22px; padding:12px 14px 12px 18px;
    display:grid; grid-template-columns:1fr 48px; gap:10px; align-items:center;
    box-shadow:0 5px 0 var(--paper-d), 0 10px 22px rgba(0,0,0,.3);
  }
  .prompt .t { font-family:var(--f-display); font-weight:700; font-size:23px; line-height:2 }
  .prompt rt { color:var(--ink-soft) }
  .prompt .icon-btn { background:var(--paper-d); color:var(--ink) }
  .prompt .icon-btn.speaking { background:var(--lamp) }
  .slots { display:flex; justify-content:center; gap:10px; margin:14px 0 8px }
  .slot { width:52px; height:52px; border-radius:50%; border:3px dashed rgba(247,238,218,.5); display:grid; place-items:center; font-size:28px }
  .slot.on { border:3px solid var(--lamp); background:rgba(244,201,93,.2); animation:pop .35s }
  @keyframes pop { 0% { transform:scale(.3) } 70% { transform:scale(1.25) } 100% { transform:scale(1) } }

  .stage { position:relative; width:100%; height:300px; border-radius:24px; overflow:hidden; margin-top:6px; box-shadow:inset 0 0 0 3px rgba(255,255,255,.12), 0 10px 24px rgba(0,0,0,.3) }
  .stage.paper { background:var(--paper) }
  .item {
    position:absolute; transform:translate(-50%,-50%); appearance:none; border:0; background:transparent; cursor:pointer;
    min-width:56px; min-height:56px; padding:0; font-size:42px; line-height:1; border-radius:18px;
    display:grid; place-items:center;
  }
  .item svg { display:block }
  .item.found { background:rgba(244,201,93,.45); box-shadow:0 0 0 4px var(--lamp); animation:pop .4s }
  .item.nope { animation:shake .35s }
  .item.gone { opacity:.18; filter:grayscale(1); pointer-events:none }
  @keyframes shake { 20%,60% { transform:translate(calc(-50% - 7px),-50%) } 40%,80% { transform:translate(calc(-50% + 7px),-50%) } }
  .shake { animation:shake2 .35s }
  @keyframes shake2 { 20%,60% { transform:translateX(-7px) } 40%,80% { transform:translateX(7px) } }

  .note {
    margin-top:12px; min-height:62px; border-radius:18px; padding:8px 16px; background:rgba(247,238,218,.12);
    font-size:21px; line-height:2; display:block; font-weight:700; overflow-wrap:anywhere;
  }
  .note:empty { visibility:hidden }
  .speech > * { min-width:0 }
  .win {
    margin-top:14px; border-radius:22px; padding:14px 18px; background:linear-gradient(180deg,#4FB57A,#2E8A58); color:#fff;
    font-family:var(--f-display); font-weight:900; font-size:23px; line-height:2; text-align:center;
    animation:pop .45s; box-shadow:0 5px 0 #1D6A41, 0 10px 22px rgba(0,0,0,.3);
  }
  .win rt { color:#E7FFEF }

  .opts { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-top:14px }
  .opt {
    appearance:none; border:0; cursor:pointer; background:var(--paper); color:var(--ink); border-radius:22px;
    padding:14px 8px; min-height:132px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 5px 0 var(--paper-d), 0 8px 18px rgba(0,0,0,.3); font-size:20px; font-weight:800; line-height:1.9;
  }
  .opt .em { font-size:52px; line-height:1 }
  .opt rt { color:var(--ink-soft) }
  .opt.bad { opacity:.35; pointer-events:none }
  .opt.good { background:#DDF5E4; box-shadow:0 0 0 5px var(--green) }

  /* 密碼 */
  .keytab { display:flex; justify-content:center; gap:8px; margin-top:12px; background:rgba(247,238,218,.1); border-radius:18px; padding:10px 6px; flex-wrap:wrap }
  .kcell { background:var(--paper); color:var(--ink); border-radius:14px; padding:6px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:30px; line-height:1.1 }
  .kcell svg { display:block }
  .row { display:flex; justify-content:center; gap:10px; margin-top:14px; flex-wrap:wrap }
  .cell { width:72px; min-height:100px; border-radius:16px; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:38px; border:4px solid transparent }
  .cell.cur { border-color:var(--lamp); animation:pulse 1s infinite }
  .cell .ans { height:46px; display:grid; place-items:center; border-top:2px dashed var(--paper-d); width:100%; font-size:34px }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(244,201,93,.4) } }
  .picks { display:flex; justify-content:center; gap:12px; margin-top:16px; flex-wrap:wrap }
  .pick { appearance:none; border:0; cursor:pointer; min-width:76px; min-height:76px; border-radius:20px; background:var(--paper); color:var(--ink); font-size:42px; display:grid; place-items:center; padding:4px 8px; box-shadow:0 5px 0 var(--paper-d), 0 8px 16px rgba(0,0,0,.3) }
  .pick:active { transform:translateY(4px) }

  /* 配對 */
  .pairs { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:14px }
  .pc {
    appearance:none; border:0; cursor:pointer; min-height:92px; border-radius:20px; background:var(--paper); color:var(--ink);
    font-size:19px; font-weight:800; line-height:1.9; padding:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 5px 0 var(--paper-d), 0 8px 16px rgba(0,0,0,.3);
  }
  .pc .em { font-size:40px; line-height:1 }
  .pc rt { color:var(--ink-soft) }
  .pc.sel { box-shadow:0 0 0 5px var(--lamp) }
  .pc.done { background:#DDF5E4; box-shadow:0 0 0 4px var(--green); pointer-events:none }
  .pc.shake { animation:shake2 .35s }

  /* 排除 */
  .clue { display:flex; align-items:center; gap:14px; margin-top:12px; background:var(--lamp); color:#3A2606; border-radius:20px; padding:10px 16px; font-weight:800; font-size:21px; line-height:1.95 }
  .clue .em { font-size:44px }
  .clue rt { color:#6A4A10 }
  .crowd { display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:10px; margin-top:12px }
  .who2 {
    appearance:none; border:0; cursor:pointer; background:var(--paper); color:var(--ink); border-radius:18px; padding:8px 4px 6px;
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:17px; font-weight:800; line-height:1.9;
    box-shadow:0 4px 0 var(--paper-d), 0 8px 14px rgba(0,0,0,.28); position:relative;
  }
  .who2 .big { font-size:46px; line-height:1.15 }
  .who2 .badges { font-size:22px; min-height:30px }
  .who2 rt { color:var(--ink-soft) }
  .who2.gone { opacity:.2; filter:grayscale(1); pointer-events:none }
  .who2.gone::after { content:"✖"; position:absolute; inset:0; display:grid; place-items:center; font-size:60px; color:var(--red) }
  .who2.last { box-shadow:0 0 0 5px var(--lamp); animation:pop .5s }

  /* 走路 */
  .grid { display:grid; gap:4px; margin:12px auto 0; width:min(100%,340px) }
  .gc { aspect-ratio:1; border-radius:12px; background:rgba(247,238,218,.14); display:grid; place-items:center; font-size:30px; position:relative }
  .gc.route { background:rgba(244,201,93,.28) }
  .gc.route::before { content:""; width:12px; height:12px; border-radius:50%; background:var(--lamp); position:absolute }
  .gc.here::before, .gc.goal::before { display:none }
  .dpad { display:grid; grid-template-columns:repeat(3,76px); grid-template-rows:repeat(2,70px); gap:8px; justify-content:center; margin-top:16px }
  .dpad button { appearance:none; border:0; border-radius:20px; background:var(--paper); color:var(--ink); font-size:34px; font-weight:900; cursor:pointer; box-shadow:0 5px 0 var(--paper-d) }
  .dpad button:active { transform:translateY(4px) }
  .dpad .u { grid-column:2; grid-row:1 } .dpad .l { grid-column:1; grid-row:2 } .dpad .d { grid-column:2; grid-row:2 } .dpad .r { grid-column:3; grid-row:2 }

  /* 記憶燈 */
  .pads { display:flex; justify-content:center; gap:14px; margin-top:20px }
  .padb { appearance:none; border:0; cursor:pointer; width:30%; max-width:130px; aspect-ratio:1; border-radius:28px; opacity:.55; transition:opacity .08s, transform .08s, box-shadow .08s }
  .padb.lit { opacity:1; transform:scale(1.08); box-shadow:0 0 0 6px #fff, 0 0 40px currentColor }
  .p0 { background:#E04B43; color:#E04B43 } .p1 { background:#F2C230; color:#F2C230 } .p2 { background:#3E86E0; color:#3E86E0 }

  /* 結尾 */
  .finale { text-align:center; padding-top:10px }
  .badge { font-size:110px; line-height:1.1; animation:pop .6s; filter:drop-shadow(0 8px 12px rgba(0,0,0,.4)) }
  .finale h2 { font-family:var(--f-display); font-weight:900; font-size:34px; margin:6px 0; color:var(--lamp) }
  .think { margin:16px 0; background:var(--paper); color:var(--ink); border-radius:22px; padding:16px 18px; font-family:var(--f-display); font-weight:700; font-size:25px; line-height:2.05; text-align:left; box-shadow:0 5px 0 var(--paper-d) }
  .think rt { color:var(--ink-soft) }
  .think small { display:block; font-family:var(--f-body); font-size:15px; color:var(--ink-soft); letter-spacing:.2em }
  details.parents { text-align:left; margin:14px 0; background:rgba(247,238,218,.1); border-radius:16px; padding:10px 16px; font-size:16px; line-height:1.8 }
  details.parents summary { cursor:pointer; font-weight:700; min-height:40px; display:flex; align-items:center }
  details.parents ul { margin:6px 0 4px; padding-left:20px }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff; padding:12px 20px; border-radius:999px; font-size:18px; z-index:9; max-width:90vw; text-align:center }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important } }

  /* ---------- 角色演出舞台 ---------- */
  .act {
    position:relative; height:280px; border-radius:24px; overflow:hidden;
    box-shadow:inset 0 0 0 3px rgba(255,255,255,.12), 0 10px 24px rgba(0,0,0,.3);
  }
  .act .ground { position:absolute; left:0; right:0; bottom:0; height:17%; background:rgba(0,0,0,.2) }
  .act .fx { position:absolute; inset:0; pointer-events:none; overflow:hidden }
  .act .fx span { position:absolute; top:-10%; font-size:18px; opacity:.8; animation:fall linear infinite }
  .act .fx.snow span { font-size:20px; animation-name:snow }
  .act .fx.stars span { top:auto; animation:twinkle 2.4s ease-in-out infinite }
  .act .fx.waves span { top:auto; bottom:-6px; font-size:34px; opacity:.55; animation:drift 3.4s ease-in-out infinite alternate }
  @keyframes fall { to { transform:translateY(340px) } }
  @keyframes snow { 50% { margin-left:14px } to { transform:translateY(340px) } }
  @keyframes twinkle { 0%,100% { opacity:.15; transform:scale(.6) } 50% { opacity:1; transform:scale(1.2) } }
  @keyframes drift { to { transform:translateX(18px) } }
  .actor {
    position:absolute; transform:translate(-50%,-100%); z-index:2;
    transition:left var(--dur,1.1s) ease-in-out, top var(--dur,1.1s) ease-in-out, opacity .35s;
    font-size:60px; line-height:1;
  }
  .actor.hid { opacity:0; pointer-events:none }
  .actor .b { display:block; transform-origin:50% 100% }
  .actor .f { display:block; filter:drop-shadow(0 4px 3px rgba(0,0,0,.35)); transition:filter .6s }
  .actor .f.dark { filter:brightness(.18) drop-shadow(0 4px 3px rgba(0,0,0,.35)) }
  .actor svg { width:84px; height:auto; display:block }
  .actor .emo {
    position:absolute; left:50%; top:-6px; transform:translate(-50%,-100%); font-size:30px; line-height:1;
    background:#fff; color:#222; border-radius:16px; padding:4px 8px; box-shadow:0 3px 8px rgba(0,0,0,.3);
    animation:emo 1.9s ease-out forwards; white-space:nowrap;
  }
  @keyframes emo { 0% { opacity:0; transform:translate(-50%,-70%) scale(.4) } 15% { opacity:1; transform:translate(-50%,-110%) scale(1.15) }
                   25% { transform:translate(-50%,-100%) scale(1) } 80% { opacity:1 } 100% { opacity:0; transform:translate(-50%,-130%) } }
  .b.talk  { animation:talk .5s ease-in-out 4 }
  .b.hop   { animation:hop .6s ease-out 2 }
  .b.shake { animation:shk .6s ease-in-out 1 }
  .b.nod   { animation:nod .6s ease-in-out 2 }
  .b.tilt  { animation:tilt 1.6s ease-in-out 1 }
  .b.grow  { animation:grow 1.2s ease-in-out 1 }
  .b.spin  { animation:spin .9s ease-in-out 1 }
  .b.wave  { animation:wave .5s ease-in-out 4 }
  .b.pop   { animation:popin .5s ease-out 1 }
  .b.fall  { animation:fallin .8s cubic-bezier(.3,1.4,.5,1) 1 }
  .b.walk  { animation:walk .32s ease-in-out infinite }
  @keyframes talk  { 50% { transform:translateY(-6px) scale(1.04) } }
  @keyframes hop   { 40% { transform:translateY(-36px) } 70% { transform:translateY(0) scaleY(.92) } }
  @keyframes shk   { 20%,60% { transform:translateX(-10px) rotate(-5deg) } 40%,80% { transform:translateX(10px) rotate(5deg) } }
  @keyframes nod   { 50% { transform:rotate(9deg) translateY(4px) } }
  @keyframes tilt  { 20%,80% { transform:rotate(-14deg) } }
  @keyframes grow  { 30%,70% { transform:scale(1.35) } }
  @keyframes spin  { to { transform:rotate(360deg) } }
  @keyframes wave  { 50% { transform:rotate(-12deg) translateX(-4px) } }
  @keyframes popin { 0% { transform:scale(0) } 70% { transform:scale(1.25) } 100% { transform:scale(1) } }
  @keyframes fallin{ 0% { transform:translateY(-260px) rotate(-20deg); opacity:0 } 100% { transform:none; opacity:1 } }
  @keyframes walk  { 50% { transform:translateY(-9px) rotate(2deg) } }
  .spark { position:absolute; z-index:3; font-size:26px; animation:sp 1.2s ease-out forwards; pointer-events:none }
  @keyframes sp { 0% { opacity:0; transform:scale(.3) } 30% { opacity:1; transform:scale(1.3) } 100% { opacity:0; transform:translateY(-30px) scale(.8) } }

  .act3d { position:relative; height:310px; border-radius:24px; overflow:hidden; background:#1a2040;
           box-shadow:inset 0 0 0 3px rgba(255,255,255,.12), 0 10px 24px rgba(0,0,0,.3) }

  .who { width:84px !important; height:84px !important }
  .speech { grid-template-columns:84px 1fr !important }
  .who img { width:100%; height:100%; object-fit:cover; display:block }
</style>
</head>
<body>
<div class="wrap">

  <!-- 首頁 -->
  <section id="home">
    <div class="cover">

    baker:  { skin:0xF0C39A, hair:0x6a4a2a, tie:0x8B1E2B, coat:0xF4F0E8, pants:0x6a6a70, collar:0xDAD2C0, hat:'chef', apron:1, size:1.02, build:1.18, nose:1.2, freckle:1 },
    sailor: { skin:0xD6A478, hair:0x1c1410, tie:0x1F3355, coat:0x2a3a5a, pants:0xEDEDED, collar:0x1a2640, hat:'flatcap', beard:0x1c1410, size:1.03, build:1.1, sideburns:1 },
    redwoman:{ skin:0xF8D8B8, hair:0xB8501E, coat:0x3E6E5E, dress:0x3E6E5E, pants:0x2a2a30, collar:0x1e4a3e, hairStyle:'curly', lash:1, size:.95, freckle:1, belt:1, trim:0xE8E0D0 },
    dark1:  { skin:0x9A6A44, hair:0x1a1410, tie:0xE0A030, coat:0x3a3a4e, pants:0x2d3036, collar:0x222230, hat:'none', hairStyle:'curly', size:1.02, build:1.05 },
    eastern:{ skin:0xE6C08A, hair:0x14100e, tie:0x7A1E2B, coat:0x2e3a4a, pants:0x252a33, collar:0x1a222e, hat:'none', hairStyle:'slick', glass:1, size:.96, build:.95 }
  };

  /* 全員英倫紳士：及膝大衣（翻領、天鵝絨領、雙排釦、口袋蓋）、襯衫與領帶、長褲、皮鞋、帽子 */
  function buildPerson(name, extra = {}) {
    const o = Object.assign({}, PRESET[name] || PRESET.pax, extra);
    const root = new THREE.Group();
    const sz = (o.size || 1) * .98;
    const body = grp(root); body.scale.setScalar(sz);
    const build = o.build || 1;
    const rig = { root, body };

    const skin = mat(o.skin, { roughness:.6, emissive:o.skin, emissiveIntensity:.1 });
    const coat = new THREE.MeshStandardMaterial({ color:o.coat, roughness:.86, side:THREE.DoubleSide, bumpMap:woolBump(), bumpScale:.009 });
    const collarM = mat(o.collar || new THREE.Color(o.coat).multiplyScalar(.55).getHex(), { roughness:.95 });
    /*FRENCH*/
    const stripeTex = () => {
      const c = document.createElement('canvas'); c.width = 64; c.height = 64; const x = c.getContext('2d');
      x.fillStyle = '#4a4850'; x.fillRect(0, 0, 64, 64);
      x.fillStyle = '#c8c6cc'; for (let i = 0; i < 64; i += 16) x.fillRect(i + 6, 0, 3, 64);
      const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 1);
      if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding; return t;
    };
    const pantsM = o.french
      ? new THREE.MeshStandardMaterial({ map:stripeTex(), roughness:.85 })
      : mat(o.pants || 0x2d3036, { roughness:.9 });
    const shoe = mat(o.shoe || 0x1b1512, { roughness:.3, metalness:.2 });
    const hairM = mat(o.hair, { roughness:.8 });
    const white = mat(0xF7F2E8, { roughness:.6 });
    const dark = mat(0x1a1416, { roughness:.35 });
    const brass = mat(0xC9A24A, { metalness:.8, roughness:.3 });
    const handM = o.gloves ? white : skin;

    /* ---- 腿：長褲 + 皮鞋（大衣下擺下面露出小腿） ---- */
    const HIP = .94; /*V3*/
    const hips = grp(body, 0, HIP, 0); rig.hips = hips;
    for (const s of [-1, 1]) {
      const th = grp(hips, s * .095 * build, 0, 0);
      mesh(cyl(.088 * build, .064, .48, 14), pantsM, th, 0, -.23, 0);
      const sh = grp(th, 0, -.46, 0);
      mesh(sph(.066, 12, 10), pantsM, sh, 0, 0, 0);
      mesh(cyl(.064, .046, .44, 14), pantsM, sh, 0, -.22, 0);
      mesh(cyl(.05, .052, .035, 14), mat(new THREE.Color(o.pants || 0x2d3036).multiplyScalar(.8).getHex(), { roughness:.9 }), sh, 0, -.405, 0);   // 褲腳翻邊
      if (o.french) mesh(cyl(.058, .062, .13, 14), white, sh, 0, -.395, 0);
      const ft = mesh(cap(.052, .15), shoe, sh, 0, -.44, .085); ft.rotation.x = Math.PI / 2; ft.scale.set(1.05, 1, .62);
      mesh(box(.12, .022, .27), mat(0x2a1c16), sh, 0, -.475, .09, false);                                   // 鞋底
      mesh(box(.1, .012, .03), mat(0xeeeeee), sh, 0, -.405, .15, false);                                    // 鞋帶
      mesh(cyl(.045, .05, .03, 10), mat(0x2a1c16), sh, 0, -.455, -.025, false);                             // 鞋跟
      (s < 0 ? (rig.rLeg = th, rig.rShin = sh) : (rig.lLeg = th, rig.lShin = sh));
    }

    /* ---- 軀幹：及膝大衣 ---- */
    const torso = grp(hips, 0, 0, 0); rig.torso = torso;
    const flare = o.belt ? 1.12 : 1;
    const prof = (o.french
      ? [[.19, -.08], [.18, .02], [.155, .2], [.17, .34], [.205, .46], [.226, .55], [.178, .62], [.078, .67]]
      : [[.31 * flare, -.47], [.29 * flare, -.3], [.24 * flare, -.1], [.185, .05], [.165, .2], [.185, .34], [.212, .46], [.228, .55], [.175, .62], [.078, .67]])
      .map(([r, y]) => [r * build, y]);
    const tmesh = lathe(prof, coat, torso, { seg:28 }); tmesh.scale.z = .72;
    for (const s of [-1, 1]) mesh(sph(.088, 12, 10), coat, torso, s * .218 * build, .55, 0);          // 肩
    if (o.french) {
      // 燕尾：背後兩片長下擺
      for (const s of [-1, 1]) { const tl = mesh(box(.13, .56, .028), coat, torso, s * .075 * build, -.2, -.125 * build); tl.rotation.x = -.1; }
      // 緞面翻領（絲質亮面）+ 左胸紅色康乃馨
      const silk = mat(0x0a0810, { roughness:.2, metalness:.3 });
      for (const s of [-1, 1]) { const sl = mesh(box(.06, .32, .02), silk, torso, s * .1 * build, .5, .135 * build); sl.rotation.z = s * -.3; }
      mesh(sph(.032, 10, 8), mat(0xD0202A, { roughness:.5 }), torso, .13 * build, .5, .15 * build, false);
      mesh(cyl(.006, .006, .06, 6), mat(0x2E7D32), torso, .13 * build, .46, .148 * build, false);
    }
    const fz = .135 * build;                                                                        // 大衣前緣 z
    // 襯衫 + 背心（翻領之間露出）
    const vest = mesh(sph(.1, 14, 10), mat(o.vest || 0x3a3a46, { roughness:.8 }), torso, 0, .38, fz * .72); vest.scale.set(.72, 1.35, .3);
    const shirt = mesh(sph(.1, 14, 10), white, torso, 0, .53, fz * .8); shirt.scale.set(.62, 1.0, .28);
    // 翻領
    for (const s of [-1, 1]) {
      const lp = mesh(box(.075, .3, .02), coat, torso, s * .098 * build, .5, fz * .98); lp.rotation.z = s * -.32; lp.rotation.y = s * -.12;
      mesh(box(.02, .3, .022), collarM, torso, s * .1 * build, .5, fz * .99, false).rotation.z = s * -.32;
    }
    // 天鵝絨領（立領一圈）
    const cl = mesh(tor(.1 * build, .042), collarM, torso, 0, .65, 0); cl.rotation.x = Math.PI / 2; cl.scale.set(1.05, .95, 1.2);
    for (const s of [-1, 1]) { const cp = mesh(cone(.028, .075, 6), white, torso, s * .05, .625, fz * .98, false); cp.rotation.z = s * .55; cp.rotation.x = Math.PI; }   // 襯衫領尖
    mesh(box(.012, .4, .012), dark, torso, 0, -.2, -.19 * build, false);                                                             // 外套後開衩
    // 雙排釦與口袋蓋
    for (const s of [-1, 1]) for (let k = 0; k < 3; k++) mesh(sph(.019, 8, 6), o.gold ? brass : mat(0x241a14), torso, s * .06 * build, .02 + k * .13, fz * 1.0, false);
    for (const s of [-1, 1]) mesh(box(.1, .035, .02), coat, torso, s * .1 * build, -.08, fz * 1.02, false);
    if (o.belt) { const bl = mesh(tor(.19 * build, .022), mat(0x2a1c14), torso, 0, .16, 0); bl.rotation.x = Math.PI / 2; bl.scale.set(1, .72, 1); }
    if (o.dress) {   // 長洋裝：寬裙擺 + 腰帶 + 白色領片
      const dm = new THREE.MeshStandardMaterial({ color:o.dress, roughness:.8, side:THREE.DoubleSide, bumpMap:woolBump(), bumpScale:.012 });
      const sk = lathe([[.4 * build, -.47], [.35 * build, -.25], [.28 * build, -.05], [.2 * build, .12]], dm, torso, { seg:30 }); sk.scale.z = .85;
      mesh(tor(.4 * build, .018), mat(o.trim || 0xF4EAD0), torso, 0, -.47, 0).rotation.x = Math.PI / 2;
    }
    if (o.apron) { const ap = mesh(box(.3 * build, .55, .02), mat(0xFAF6EC, { roughness:.9 }), torso, 0, -.1, fz * 1.12); mesh(box(.3 * build, .05, .022), mat(0xE8E0CC), torso, 0, .18, fz * 1.13, false); }
    if (o.hank) { const hk = mesh(box(.05, .045, .014), white, torso, -.13 * build, .33, fz * 1.02, false); hk.rotation.z = .3; }
    if (o.watch) {   // 懷錶金鍊
      const ch = mesh(tor(.07, .006, Math.PI), brass, torso, .02, .28, fz * .98, false); ch.rotation.z = Math.PI;
      mesh(sph(.017, 8, 6), brass, torso, .09, .22, fz * 1.0, false);
    }
    if (o.shawl) { const sw2 = mesh(sph(.27 * build, 18, 12, 0, TAU, 0, Math.PI * .55), mat(o.shawl, { roughness:.95 }), torso, 0, .5, -.01); sw2.scale.set(1.0, .55, .8); }
    if (o.scarf) { const sc = mesh(tor(.12, .05), mat(o.scarf, { roughness:.9 }), torso, 0, .66, 0); sc.rotation.x = Math.PI / 2; mesh(box(.09, .28, .03), mat(o.scarf), torso, .06, .44, fz * 1.02); }
    if (o.pack) mesh(box(.26, .32, .13), mat(0xC23B33), torso, 0, .28, -.14);

    /* 披風 */
    if (o.cape && name !== 'lupin') {
      const capeM = new THREE.MeshStandardMaterial({ map:tweedTex(o.cape), roughness:.95, side:THREE.DoubleSide });
      lathe([[.43 * build, .22], [.37 * build, .4], [.3 * build, .55], [.22, .63]], capeM, torso, { seg:30, phiStart:.45, phiLength:TAU - .9 });
    }
    if (name === 'lupin') {
      const out = mat(o.cape, { roughness:.8, side:THREE.DoubleSide }), inn = mat(o.lining, { roughness:.8, side:THREE.DoubleSide });
      const pts = [[.64, -.5], [.6, -.22], [.47, .2], [.33, .5], [.25, .63]];
      lathe(pts, out, torso, { seg:26, phiStart:Math.PI * .5, phiLength:Math.PI });
      lathe(pts.map(([r, y]) => [r * .97, y + .006]), inn, torso, { seg:26, phiStart:Math.PI * .5, phiLength:Math.PI });
    }
    if (o.gold && (name === 'police' || name === 'captain')) for (const s of [-1, 1]) mesh(box(.07, .03, .02), brass, torso, s * .22 * build, .56, 0, false);

    /* 脖子、領帶 */
    mesh(cyl(.052, .062, .16, 14), skin, torso, 0, .72, 0);
    if (o.tie) { const t = mesh(cone(.04, .27, 10), mat(o.tie, { roughness:.6 }), torso, 0, .45, fz * .9); t.rotation.x = Math.PI; t.scale.z = .6; mesh(sph(.028, 10, 8), mat(o.tie), torso, 0, .59, fz * .86); }
    if (name === 'lupin') {
      const bm = mat(0xC23B33, { roughness:.5 });
      mesh(cone(.05, .1, 12), bm, torso, -.06, .62, fz * .9).rotation.z = Math.PI / 2;
      mesh(cone(.05, .1, 12), bm, torso, .06, .62, fz * .9).rotation.z = -Math.PI / 2;
      mesh(sph(.028), bm, torso, 0, .62, fz * .92);
    }

    /* ---- 手臂：大衣袖 + 襯衫袖口 + 手 ---- */
    for (const s of [-1, 1]) {
      const sh = grp(torso, s * (.218 * build + .02), .54, 0);
      mesh(cyl(.066, .056, .27, 14), coat, sh, 0, -.135, 0);
      const el = grp(sh, 0, -.27, 0);
      mesh(sph(.058, 10, 8), coat, el, 0, 0, 0);
      mesh(cyl(.056, .047, .25, 14), coat, el, 0, -.125, 0);
      mesh(cyl(.05, .05, .035, 12), white, el, 0, -.262, 0);
      for (let b = 0; b < 2; b++) mesh(sph(.011, 8, 6), mat(0x241a14), el, 0, -.185 - b * .045, .058, false);   // 袖釦
      const hand = grp(el, 0, -.285, 0);
      const palm = mesh(cap(.04, .035), handM, hand, 0, -.04, 0); palm.scale.set(1.2, 1, .6); palm.userData.noOutline = true;
      for (let f = 0; f < 4; f++) {
        const len = (f === 1 || f === 2) ? .062 : .052;
        const fg = grp(hand, (f - 1.5) * .02, -.082, 0); fg.rotation.x = -.2 - f * .02;
        mesh(cap(.011, len), handM, fg, 0, -len / 2, 0).userData.noOutline = true;
      }
      const thb = grp(hand, s * -.05, -.04, .008); thb.rotation.z = s * .75; thb.rotation.x = -.2;
      mesh(cap(.013, .034), handM, thb, 0, -.028, 0).userData.noOutline = true;
      if (s < 0) { rig.rSh = sh; rig.rEl = el; rig.rHand = hand; } else { rig.lSh = sh; rig.lEl = el; rig.lHand = hand; }
    }
    if (o.umbrella) {
      const ug = grp(rig.lHand, 0, -.02, 0);
      mesh(cyl(.012, .012, .95, 8), mat(0x1a1420), ug, 0, -.35, 0);
      mesh(cone(.012, .16, 6), brass, ug, 0, -.84, 0).rotation.x = Math.PI;
      mesh(tor(.045, .012, Math.PI), mat(0x3a2616), ug, 0, .13, 0);
    }
    if (o.bandage) {
      mesh(cyl(.066, .066, .15, 16), white, rig.rEl, 0, -.18, 0);
      mesh(box(.04, .11, .02), mat(0xC23B33), rig.rEl, 0, -.18, .07, false);
      mesh(box(.11, .04, .02), mat(0xC23B33), rig.rEl, 0, -.18, .07, false);
    }

    /* ---- 頭 ---- */
    const head = grp(torso, 0, .76, 0); rig.head = head;
    const hs = (o.head || 1) * .64 * (o.headK || 1);
    const skull = grp(head, 0, .27 * hs * .98, 0); skull.scale.setScalar(hs);
    const hmesh = mesh(sph(.27, 30, 22), skin, skull, 0, 0, 0); hmesh.scale.set(.92 * (o.faceW || 1), 1.08 * (o.faceH || 1), .98);
    const chin = mesh(sph(.12, 16, 12), skin, skull, 0, -.17, .08); chin.scale.set(1.1 * (o.jaw || 1), .78, .9);
    for (const sx of [-1, 1]) {
      const ear = mesh(sph(.06), skin, skull, sx * .25, -.005, -.015); ear.scale.set(.4, 1.15, .8);
      mesh(sph(.03), mat(0xE9A98C, { roughness:.8 }), skull, sx * .262, -.005, 0, false).scale.set(.3, .9, .6);
    }
    const eyeZ = .238 + (o.mask ? .02 : 0);
    rig.eyes = [];
    for (const sx of [-1, 1]) {
      const eg = grp(skull, sx * .092, .035, eyeZ); eg.scale.setScalar(1.28);
      const w = mesh(sph(.047, 14, 10), white, eg, 0, 0, 0, false); w.scale.set(1.15, .85, .5);
      const lid = mesh(tor(.05, .0075, Math.PI), dark, eg, 0, .002, .02, false); lid.scale.set(1.1, .8, 1);   // 上眼瞼
      const ir = mesh(sph(.032, 12, 10), mat(0x3a2418, { roughness:.35 }), eg, 0, -.002, .012, false); ir.scale.set(1, 1, .6);
      mesh(sph(.017, 10, 8), dark, eg, 0, -.002, .02, false).scale.set(1, 1, .6);
      mesh(sph(.009, 8, 6), mat(0xffffff, { emissive:0xffffff, emissiveIntensity:.8 }), eg, .01, .012, .027, false);
      rig.eyes.push(eg);
      const br = mesh(box(.105, .022, .02), hairM, skull, sx * .095, .115, eyeZ - .012, false);
      (sx < 0 ? rig.browR = br : rig.browL = br);
    }
    const noseM = mat(new THREE.Color(o.skin).multiplyScalar(.95).getHex(), { roughness:.6, emissive:o.skin, emissiveIntensity:.15 });
    const nb = mesh(cone(.036, .11, 12), noseM, skull, 0, -.02, .255, false); nb.rotation.x = Math.PI / 2 + .35; nb.scale.set(o.nose || 1, o.nose || 1, .9);
    mesh(sph(.036, 12, 10), noseM, skull, 0, -.062, .292, false).scale.set(1, .85, .9);
    const cheekM = mat(0xF29A9A, { roughness:.9, transparent:true, opacity:.3 });
    for (const sx of [-1, 1]) { const c = mesh(sph(.045, 10, 8), cheekM, skull, sx * .15, -.065, .205, false); c.scale.set(1, .6, .4); }
    const smile = mesh(tor(.05, .009, Math.PI), dark, skull, 0, -.115, .24, false); smile.rotation.z = Math.PI;
    const lip = mesh(tor(.036, .011, Math.PI), mat(o.lips || (o.lash ? 0xC4384A : 0xC66A70), { roughness:.5 }), skull, 0, -.138, .238, false); lip.rotation.z = Math.PI;   // 下唇
    const open = mesh(sph(.045, 12, 8), mat(0x6B1E24, { roughness:.5 }), skull, 0, -.125, .232, false); open.scale.set(1, .1, .4);
    rig.smile = smile; rig.open = open;
    if (o.lash) for (const sx of [-1, 1]) {   // 睫毛
      for (let k = 0; k < 3; k++) { const l = mesh(box(.004, .026, .004), dark, skull, sx * (.092 + (k - 1) * .028), .035 + .052 + (k === 1 ? .006 : 0), eyeZ + .012, false); l.rotation.z = (k - 1) * -.45 * sx; }
    }
    if (o.freckle) for (let k = 0; k < 6; k++) mesh(sph(.007), mat(0xB2704A), skull, (k % 2 ? 1 : -1) * (.05 + (k >> 1) * .028), -.045 - (k >> 1) * .005, .262 - (k >> 1) * .006, false);
    if (o.mustache) {
      const mm = mat(o.mustache, { roughness:o.french ? .35 : .9 });
      for (const sx of [-1, 1]) {
        const m = mesh(sph(.04, 10, 8), mm, skull, sx * .055, -.088, .262, false); m.scale.set(1.7, .4, .55); m.rotation.z = sx * -.3;
        if (o.french) { const tip = mesh(cone(.012, .09, 8), mm, skull, sx * .13, -.07, .24, false); tip.rotation.z = -sx * 1.15; } // 上翹鬍尖
      }
    }
    if (o.french) { const gt = mesh(cone(.032, .1, 10), mat(o.hair, { roughness:.6 }), skull, 0, -.215, .17, false); gt.rotation.x = Math.PI - .25; }  // 山羊鬍
    if (o.beard) { const bmat = mat(o.beard, { roughness:.95 }); const b = mesh(sph(.19, 16, 12), bmat, skull, 0, -.17, .07); b.scale.set(.98, .8, .85); }
    for (const sx of [-1, 1]) { const sb = mesh(cap(.032, .09), hairM, skull, sx * .235, .06, .03); sb.rotation.z = sx * .08; }
    const HS = o.hairStyle || 'short';
    if (HS !== 'bald') {
      const hair = mesh(new THREE.SphereGeometry(.285, 26, 16, 0, TAU, 0, Math.PI * (HS === 'slick' ? .46 : .5)), hairM, skull, 0, .0, -.015);
      hair.rotation.x = -.4; hair.scale.set(.96, 1.05, 1);
      const n = HS === 'curly' ? 16 : 7;
      for (let i = 0; i < n; i++) {   // 髮束：讓頭髮有層次
        const a = i * (HS === 'curly' ? .55 : .9) + .3;
        const r0 = HS === 'curly' ? .045 : .07;
        const lk = mesh(sph(r0, 12, 8), hairM, skull, Math.sin(a) * (HS === 'curly' ? .2 : .17), .2 + Math.cos(a * 1.7) * .05 + (HS === 'curly' ? .04 : 0), -.07 + Math.cos(a) * .12, false);
        lk.scale.set(HS === 'curly' ? 1.2 : 1.35, HS === 'curly' ? 1 : .55, 1.15); lk.rotation.set(Math.sin(a * 2) * .3, a, Math.cos(a) * .4);
      }
    } else {   // 禿頭：只留兩側的短髮與高光
      mesh(sph(.05), skin, skull, 0, .27, .03, false).scale.set(1.6, .5, 1.3);
    }
    if (o.bun) mesh(sph(.1), hairM, skull, 0, .24, -.17);
    if (HS === 'long') {   // 及肩長髮
      const bk = mesh(cap(.17, .38), hairM, skull, 0, -.22, -.13); bk.scale.set(1.15, 1, .75);
      for (const sx of [-1, 1]) { const sd = mesh(cap(.06, .3), hairM, skull, sx * .235, -.14, -.01); sd.rotation.z = sx * .06; }
    } else if (HS === 'bob') {   // 鮑伯頭
      const bb = mesh(sph(.29), hairM, skull, 0, -.06, -.03); bb.scale.set(1.0, .85, 1.0);
      for (const sx of [-1, 1]) mesh(sph(.08), hairM, skull, sx * .22, -.15, .06).scale.set(.8, 1.2, 1);
    } else if (HS === 'ponytail') {  // 馬尾
      mesh(sph(.06), mat(0xC23B33), skull, 0, .1, -.27, false);
      const pt = mesh(cap(.07, .34), hairM, skull, 0, -.12, -.3); pt.rotation.x = .25;
    } else if (HS === 'pigtails') {  // 雙辮子

      ],
      think:"遇到一個你信任的人，其實是壞人時，你會怎麼冷靜面對？",
      ask:["「火車時刻表，怎麼幫羅蘋抓到壞人？」","「為什麼羅蘋要先安慰夫人？」","「羅蘋為什麼把東西還給大家？」"] }
  ];
  /* 選擇題的正確答案位置輪流排（0/1/2），避免小朋友發現「答案都在同一格」 */
  CASES.forEach(c => c.steps.forEach((s, j) => {
    if (s.play !== 'choose' || !s.cfg || s.cfg.opts.length !== 3) return;
    const o = s.cfg.opts, k = o.findIndex(x => x.ok), to = (c.id.length + j) % 3;
    if (k < 0 || k === to) return;
    const [hit] = o.splice(k, 1); o.splice(to, 0, hit);
  }));

  /* 場景資料需要程式產生的部分 */
  const FLAG_LAYOUT = [ // [x%, y%, pose, flag]
    [14,22,0,0],[38,18,2,1],[62,20,4,0],[86,24,3,0],
    [16,52,1,0],[40,50,5,0],[63,54,3,1],[87,50,2,0],
    [12,82,4,0],[38,80,0,0],[62,82,1,1],[86,80,5,0]
  ];
  function buildSpotItems(tag) {
    if (tag === 'FLAGMEN') return FLAG_LAYOUT.map(([x, y, p, f]) => ({ h:man(p, !!f), x, y, clue:!!f, icon:'🚩', note:"對，旗子小人！", nopeNote:"這個小人沒有旗子。", m3d:{ type:'man', pose:POSES[p], flag:!!f } }));
    if (tag === 'GEESE') {
      const spots = [], cols = 4, rows = 3;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) spots.push([14 + c * 24 + (r % 2) * 5, 20 + r * 30]);
      const mark = ['🔵','','🔴','','','🔵','','🔴','','🔵','','']; // 3 藍、2 紅
      return spots.map(([x, y], i) => ({
        h:`<span style="position:relative;display:inline-block">🦢${mark[i] ? `<span style="position:absolute;right:-4px;bottom:-2px;font-size:20px">${mark[i]}</span>` : ''}</span>`,
        x, y, clue:mark[i] === '🔵', icon:'🔵', m3d:{ type:'goose', mark:mark[i] === '🔵' ? 'blue' : (mark[i] ? 'red' : '') }, note:mark[i] === '🔵' ? "腳上有藍色記號！" : (mark[i] ? "這個是紅色記號，不是藍色。" : "這隻鵝沒有記號。")
      }));

  }
  const PASSENGERS = [
    { id:'A', name:"藍外套", a:{ hair:'gold', hat:true, bandage:true, coat:'#3E6FB0' } },
    { id:'B', name:"綠外套", a:{ hair:'gold', hat:true, bandage:false, coat:'#3E9B5E' } },

    { id:'F', name:"灰外套", a:{ hair:'brown', hat:false, bandage:true, coat:'#7C8794' } },
    { id:'G', name:"橘外套", a:{ hair:'black', hat:true, bandage:false, coat:'#D9702A', glass:true } },

  /* =====================================================================
     5. 聲音
     ===================================================================== */
  let actx = null;
  function beep(f = 660, d = .16, type = 'sine') {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.16, actx.currentTime + .01);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + d);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d + .02);
    } catch (e) {}
  }
  const jingle = () => { [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle'), i * 120)); };
  const buzz = () => beep(180, .18, 'sawtooth');

  let zhVoice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    zhVoice = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  let lastSpoken = '';
  function speak(text, btn) {
    lastSpoken = text;
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[🔊]/g, ''));
    u.lang = 'zh-TW'; u.rate = .8; u.pitch = 1.05;
    if (zhVoice) u.voice = zhVoice;
    document.querySelectorAll('.speaking').forEach(b => b.classList.remove('speaking'));
    if (btn) { btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
    speechSynthesis.speak(u);
  }
  let toastT = null;
  function toast(msg) {
    document.getElementById('toast')?.remove(); clearTimeout(toastT);
    const t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.innerHTML = T(msg);
    document.body.appendChild(t); toastT = setTimeout(() => t.remove(), 1800);
  }

  /* =====================================================================
     6. 存檔
     ===================================================================== */
  const KEY = 'detective.v1';
  let save = { done:{}, step:{} };
  try { const r = localStorage.getItem(KEY); if (r) save = Object.assign(save, JSON.parse(r)); } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  /* =====================================================================
     7. 畫面
     ===================================================================== */
  const $ = s => document.querySelector(s);
  const homeEl = $('#home'), caseEl = $('#case'), body = $('#body'), dotsEl = $('#dots');
  let cur = null;
  const plain = s => s.replace(/<[^>]+>/g, '');

  function showHome() {
    Stage3D.unmount();
    speechSynthesis?.cancel?.();
    caseEl.hidden = true; homeEl.hidden = false; cur = null;
    $('#home-title').innerHTML = T(UI.title);
    $('#home-sub').textContent = UI.sub;
    $('#heroes').innerHTML = SVG_HOLMES + SVG_LUPIN;
    $('#cases').innerHTML = '';
    CASES.forEach(c => {
      const b = document.createElement('button');
      b.className = 'card ' + c.hero;
      const doneMark = save.done[c.id] ? c.badge : (save.step[c.id] ? '▶' : '');
      b.innerHTML = `<span class="no">${c.no}</span>
        <span><div class="ti">${T(c.title)}</div><div class="tag">${c.hero === 'h' ? UI.holmes : UI.lupin}</div></span>
        <span class="st">${doneMark}</span>`;

  function openCase(id, from = 0) {
    const c = CASES.find(x => x.id === id);
    cur = { c, i:Math.min(from, c.steps.length - 1) };
    homeEl.hidden = true; caseEl.hidden = false;

  }
  function renderDots() {
    dotsEl.innerHTML = cur.c.steps.map((_, k) => `<i class="${k < cur.i ? 'on' : ''} ${k === cur.i ? 'cur' : ''}"></i>`).join('');
  }
  function renderStep() {
    Stage3D.unmount(); clearInterval(whoTimer);
    const s = cur.c.steps[cur.i];
    save.step[cur.c.id] = cur.i; persist();
    renderDots(); window.scrollTo(0, 0);

    if (s.say) renderSay(s); else renderPlay(s);
  }
  function nextStep() {
    cur.i++;

  let whoTimer = null;
  function renderSay(s) {
    let k = 0;
    const staged = !!s.scene.cast;
    body.innerHTML = `
      ${staged ? '<div id="act" class="act"></div>' : `<div class="art bg-${s.scene.bg}">${s.scene.art.map(e => `<span>${e}</span>`).join('')}</div>`}
      <div class="speech"><div class="who" id="who"></div><div class="line" id="line"></div></div>
      <div class="next"><button class="btn quiet" id="prev"></button><button class="btn" id="go"></button></div>`;
    const host = $('#act');
    k = cur.startAtEnd ? s.say.length - 1 : 0; cur.startAtEnd = false;
    $('#prev').innerHTML = '◀ ' + T(UI.prev);
    const goPrev = () => {
      if (k > 0) { rebuildTo(k - 1); }
      else if (cur.i > 0) { cur.i--; cur.startAtEnd = true; renderStep(); }
    };
    $('#prev').onclick = goPrev;
    let st3 = null, map = null;
    const startStage = () => {
      if (!staged) return;
      if (Stage3D.ready) { st3 = Stage3D.mount(host, s.scene); }
      if (!st3) { host.className = 'act'; map = Act.build(host, s.scene); }
    };
    startStage();
    const PORTRAIT = { h:'holmes', w:'watson', l:'lupin', c:'client', r:'redhead', i:'irene', o:'lord', s:'holmes', p:'police' };
    const setWho = w => {
      const who = $('#who'); clearInterval(whoTimer);
      const pf = Stage3D.ready && PORTRAIT[w];
      const a = pf ? Stage3D.portrait(pf, false) : null, b = pf ? Stage3D.portrait(pf, true) : null;
      if (a && b) {
        who.innerHTML = '<img alt="" src="' + a + '">'; const img = who.firstChild; let n = 0;
        whoTimer = setInterval(() => { const sp = $('#btn-replay').classList.contains('speaking'); img.src = (sp && (n++ % 2)) ? b : a; }, 160);
      } else who.innerHTML = WHO[w].html;
    };
    const runActs = () => {
      const [w, , acts] = s.say[k];
      if (st3) st3.run(acts, w); else if (map) Act.run(map, host, acts, w);
    };
    // 只回放「狀態類」動作（走位、出現、隱藏、變色），讓角色從起始位置走到這一句該在的位置
    const stateOnly = j => (s.say[j][2] || [])
      .filter(a => /^\S+\s+(go|show|hide|dark|clean)(\s|$)/.test(a))
      .map(a => {
        const p = a.trim().replace(/\s+@\d+$/, '').split(/\s+/);
        return p[1] === 'go' ? [p[0], 'go', p[2], p[3] || '-', '0.3'].join(' ') : p.join(' ');
      });
    const stateUpTo = kk => {
      for (let j = 0; j < kk; j++) {
        const a = stateOnly(j); if (!a.length) continue;
        if (st3) st3.run(a, null); else if (map) Act.run(map, host, a, null);
      }
    };
    const rebuildTo = kk => {
      if (staged) {
        if (st3) { st3 = Stage3D.mount(host, s.scene); }
        else { host.innerHTML = ''; map = Act.build(host, s.scene); }
      }
      k = kk; stateUpTo(kk); show();
    };
    const show = () => {
      const [w, text] = s.say[k];
      setWho(w);
      $('#line').innerHTML = T(text);
      $('#go').innerHTML = T(k < s.say.length - 1 ? UI.again : UI.go) + (k < s.say.length - 1 ? ' ▶' : '');
      $('#prev').hidden = (cur.i === 0 && k === 0);
      runActs();
      speak(text, $('#btn-replay'));
    };
    $('#go').onclick = () => { k++; if (k >= s.say.length) { nextStep(); } else show(); };
    if (k > 0) stateUpTo(k);
    show();
    // 3D 還在載入時先用 2D，載完再升級（只升級目前還在畫面上的這一幕）
    if (staged && !st3 && Stage3D.booting && !Stage3D.ready && !Stage3D.failed) {
      Stage3D.booting.then(() => {
        if (!Stage3D.ready || st3 || !document.body.contains(host) || host !== $('#act')) return;
        host.innerHTML = ''; map = null; st3 = Stage3D.mount(host, s.scene); if (st3) runActs();
      });
    }
  }

  function renderPlay(s) {
    body.innerHTML = `
      <div class="prompt"><div class="t">${T(s.prompt)}</div><button class="icon-btn" id="pbtn" aria-label="聽題目">🔊</button></div>
      <div id="play"></div><div id="result"></div>

  /* =====================================================================
     8. 互動元件：(cfg, 容器, 完成回呼)

  const PLAY = {};

  PLAY.choose = (cfg, box, done) => {

  /* 密碼：decode 看小人選圖；encode 看圖選小人 */
  PLAY.code = (cfg, box, done) => {
    const { key, seq, mode } = cfg;
    let pos = 0;
    box.innerHTML = `
      <div class="keytab">${key.map(k => `<div class="kcell">${man(k.p, false, 38)}<span>${k.pic}</span></div>`).join('')}</div>
      <div class="row" id="cells"></div><div class="picks" id="picks"></div>`;
    const cells = box.querySelector('#cells'), picks = box.querySelector('#picks');
    seq.forEach((ki, n) => {

    key.forEach((k, ki) => {
      const b = document.createElement('button'); b.className = 'pick';
      b.innerHTML = mode === 'decode' ? k.pic : man(k.p, false, 44);
      b.onclick = () => {
        if (pos >= seq.length) return;
        if (ki === seq[pos]) {
          cells.children[pos].querySelector('.ans').innerHTML = mode === 'decode' ? k.pic : man(k.p, false, 34);
          beep(520 + pos * 100, .12, 'triangle'); pos++; mark();
          if (pos === seq.length) { [...cells.children].forEach(c => c.classList.remove('cur')); setTimeout(done, 700); }
        } else { buzz(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
      };
      picks.appendChild(b);
    });
  };

  /* 配對 */
  PLAY.match = (cfg, box, done) => {
    const L = cfg.pairs.map((p, i) => ({ ...p.l, i })), R = cfg.pairs.map((p, i) => ({ ...p.r, i }));
    R.sort((a, b) => ((a.i * 7 + 2) % 5) - ((b.i * 7 + 2) % 5)); // 固定打亂
    box.innerHTML = `<div class="pairs"></div>`;
    const grid = box.querySelector('.pairs');
    const mk = (o, side) => {
      const b = document.createElement('button'); b.className = 'pc'; b.dataset.i = o.i; b.dataset.side = side;
      b.innerHTML = `<span class="em">${o.em}</span><span>${T(o.t)}</span>`; return b;
    };
    const lb = L.map(o => mk(o, 'l')), rb = R.map(o => mk(o, 'r'));
    // 交錯排版：左欄一張、右欄一張
    lb.forEach((l, n) => { grid.appendChild(l); grid.appendChild(rb[n]); });
    let sel = null, solved = 0;
    grid.addEventListener('click', e => {
      const b = e.target.closest('.pc'); if (!b || b.classList.contains('done')) return;
      if (!sel || sel.dataset.side === b.dataset.side) { if (sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); beep(440, .08); return; }
      if (sel.dataset.i === b.dataset.i) {
        sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); sel = null; solved++;
        beep(660, .15, 'triangle');
        if (solved === L.length) setTimeout(done, 700);
      } else {
        buzz(); [sel, b].forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); });
        sel.classList.remove('sel'); sel = null;
      }
    });
  };

  /* 排除法 */
  PLAY.elim = (cfg0, box, done) => {
    const cfg = Object.assign({}, cfg0, { clues:cfg0.clues.map(c => Object.assign({}, c, { out:[...c.out] })) }); // 用副本，重玩才不會壞
    let ci = 0;
    box.innerHTML = `<div class="clue" id="clue"></div><div class="crowd" id="crowd"></div>`;
    const crowd = box.querySelector('#crowd'), clueEl = box.querySelector('#clue');
    const els = {};
    cfg.people.forEach(p => {
      const b = document.createElement('button'); b.className = 'who2';
      b.innerHTML = `<span class="big">${p.h || p.em}</span><span>${T(p.name)}</span>${p.badges ? `<span class="badges">${p.badges}</span>` : ''}`;
      els[p.id] = b; crowd.appendChild(b);
      b.onclick = () => {
        const cl = cfg.clues[ci];
        if (cl.out.includes(p.id)) {
          b.classList.add('gone'); cl.out = cl.out.filter(x => x !== p.id); beep(330, .12, 'triangle');
          if (!cl.out.length) {
            ci++;
            if (ci >= cfg.clues.length) { els[cfg.last].classList.add('last'); setTimeout(done, 900); }
            else showClue();
          }
        } else { buzz(); say(box, UI.keep); }
      };
    });
    function showClue() {
      const c = cfg.clues[ci];
      clueEl.innerHTML = `<span class="em">${c.em}</span><span>${T(c.t)}</span>`;
      speak(c.t);
    }
    showClue();
  };

  /* 走路 */
  PLAY.path = (cfg, box, done) => {
    const { cols, rows, route } = cfg;
    let at = 0;
    box.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)"></div>
      <div class="dpad"><button class="u" aria-label="上">▲</button><button class="l" aria-label="左">◀</button><button class="d" aria-label="下">▼</button><button class="r" aria-label="右">▶</button></div>`;
    const grid = box.querySelector('.grid');
    const cell = (x, y) => grid.children[y * cols + x];
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) { const c = document.createElement('div'); c.className = 'gc'; grid.appendChild(c); }
    route.forEach(([x, y]) => cell(x, y).classList.add('route'));
    const [gx, gy] = route[route.length - 1];
    cell(gx, gy).textContent = cfg.goal; cell(gx, gy).classList.add('goal');
    const place = () => {
      grid.querySelectorAll('.here').forEach(c => { c.classList.remove('here'); if (c !== cell(gx, gy)) c.textContent = ''; });
      const [x, y] = route[at]; const c = cell(x, y); c.classList.add('here'); c.textContent = (at === route.length - 1) ? cfg.goal : cfg.who;
    };
    place();
    const D = { u:[0, -1], d:[0, 1], l:[-1, 0], r:[1, 0] };
    box.querySelectorAll('.dpad button').forEach(b => {
      b.onclick = () => {
        if (at >= route.length - 1) return;
        const k = b.className, [dx, dy] = D[k], [x, y] = route[at], nx = route[at + 1];
        if (x + dx === nx[0] && y + dy === nx[1]) {
          at++; place(); beep(400 + at * 60, .08, 'triangle');
          if (at === route.length - 1) setTimeout(done, 600);
        } else { buzz(); say(box, UI.wrongWay); }
      };
    });
  };

  /* 記憶燈 */
  PLAY.simon = (cfg, box, done) => {
    const FREQ = [262, 330, 392];
    let busy = true, idx = 0;
    box.innerHTML = `<div class="pads">${[0, 1, 2].map(i => `<button class="padb p${i}" data-i="${i}" aria-label="第${i + 1}個燈"></button>`).join('')}</div>
      <div class="note" id="sn"></div>`;
    const pads = [...box.querySelectorAll('.padb')], sn = box.querySelector('#sn');
    const flash = (i, ms = 420) => new Promise(res => {
      pads[i].classList.add('lit'); beep(FREQ[i], ms / 1000, 'triangle');
      setTimeout(() => { pads[i].classList.remove('lit'); setTimeout(res, 160); }, ms);
    });
    const play = async () => {
      busy = true; idx = 0; sn.innerHTML = T(UI.watch);
      await new Promise(r => setTimeout(r, 600));
      for (const i of cfg.seq) await flash(i);
      sn.innerHTML = T(UI.yourTurn); busy = false;
    };
    pads.forEach(p => p.onclick = async () => {
      if (busy) return;
      const i = +p.dataset.i;
      flash(i, 220);
      if (i === cfg.seq[idx]) {
        idx++;
        if (idx === cfg.seq.length) { busy = true; setTimeout(done, 500); }
      } else {
        busy = true; buzz(); sn.innerHTML = T(UI.watchAgain);
        setTimeout(play, 900);
      }
    });
    play();
  };

  /* =====================================================================
     9. 檢查：本作用到的字，有沒有注音
     ===================================================================== */
  window.missingChars = () => {
    const bag = new Set();
    const eat = s => { for (const ch of String(s)) if (CJK.test(ch)) bag.add(ch); };
    eat(JSON.stringify(CASES)); eat(JSON.stringify(UI)); eat(JSON.stringify(PASSENGERS.map(p => p.name)));
    const miss = new Set();
    const scan = s => annotate(s).forEach(({ ch, zy }) => { if (CJK.test(ch) && !zy) miss.add(ch); });
    const walk = o => {
      if (typeof o === 'string') { scan(o); return; }
      if (Array.isArray(o)) o.forEach(walk);
      else if (o && typeof o === 'object') Object.entries(o).forEach(([k, v]) => { if (k !== 'h' || typeof v !== 'string' || !v.startsWith('<')) walk(v); });
    };
    walk(CASES); walk(UI); walk(PASSENGERS.map(p => p.name));
    return [...miss];
  };
  window.__cases = CASES; window.__annotate = annotate;
  window.__open = (id, i) => openCase(id, i);
  window.Stage3D_active = () => Stage3D.active; window.__buildSpot = buildSpotItems; window.__passengers = () => PASSENGERS;

  Stage3D.boot();
  showHome();
})();
</script>
