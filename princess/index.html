<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公主故事屋</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#2a1f4a;color:#2b2040;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:min(1000px,96vw);margin:0 auto;padding:12px 12px 40px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 22px;min-height:48px;background:#f7c948;color:#4a2c00;font-weight:700;font-size:18px}
button.ghost{background:#4b3a7a;color:#fff}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:#fff}
.dots{display:flex;gap:6px;flex:1;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:#6d5aa6}.dots i.on{background:#f7c948}.dots i.cur{outline:2px solid #fff}
#stagebox{position:relative;border-radius:18px;overflow:hidden;background:#b5d4f4;height:clamp(260px,58vh,600px)}
#stage{width:100%;height:100%;display:block}
.cast{transition:opacity .4s}
.walking .legL{animation:lg .5s ease-in-out infinite;transform-origin:50px 156px}
.walking .legR{animation:lg .5s ease-in-out infinite reverse;transform-origin:71px 156px}
.walking .body{animation:bob .5s ease-in-out infinite}
.walking .skirt{animation:sway .5s ease-in-out infinite;transform-origin:60px 118px}
@keyframes lg{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sway{0%,100%{transform:skewX(-3deg)}50%{transform:skewX(3deg)}}
.blink .eyes{animation:bl .3s 1}.eyes{transform-origin:60px 52px}
@keyframes bl{50%{transform:scaleY(.1)}}
.nod .head{animation:nd .7s 1}.head{transform-origin:60px 70px}
@keyframes nd{30%{transform:rotate(9deg) translateY(2px)}65%{transform:rotate(-2deg)}}
.wave .armR{animation:wv .9s 1;transform-origin:82px 88px}
@keyframes wv{0%,100%{transform:rotate(0)}25%{transform:rotate(-150deg)}50%{transform:rotate(-120deg)}75%{transform:rotate(-155deg)}}
.point .armR{transform:rotate(-80deg);transform-origin:82px 88px;transition:transform .4s}
.fear .body{animation:sh .12s 8}
@keyframes sh{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.crouchd .body{transform:translateY(22px) scaleY(.86);transform-origin:60px 182px;transition:transform .5s}
.fallen .body{transform:rotate(-88deg);transform-origin:60px 182px;transition:transform .9s}
.glow{animation:gl 1.2s 1}@keyframes gl{50%{filter:brightness(1.6)}}
.bub{animation:bb 1.9s forwards}@keyframes bb{0%{opacity:0;transform:translateY(8px)}15%,80%{opacity:1;transform:none}100%{opacity:0}}
#cap{position:relative;background:#fff8e7;border-radius:16px;margin-top:10px;padding:14px 16px;min-height:96px}
#cap .who{display:inline-block;background:#f7c948;color:#4a2c00;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;margin-bottom:4px}
#cap .txt{font-size:clamp(20px,3.2vw,28px);line-height:2.1}
ruby{ruby-position:over;ruby-align:center}ruby rt{font-size:.45em;color:#8a5a9a}
.nav{display:flex;justify-content:space-between;margin-top:10px}
#lv{background:#fff8e7;border-radius:16px;margin-top:10px;padding:14px 16px}
#lv h3{margin:0 0 10px;font-size:clamp(20px,3vw,26px)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{min-height:72px;border-radius:14px;background:#efe3ff;color:#2b2040;font-size:clamp(17px,2.6vw,22px);padding:10px;border:3px solid transparent}
.opt.ok{background:#c9f0c0;border-color:#4caf50}.opt.no{background:#ffd9d4;border-color:#e57373}
.fb{margin-top:10px;min-height:28px;font-size:18px}
.slots,.pool{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.slot{flex:1;min-width:120px;min-height:64px;border:3px dashed #b9a5e0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff}
.card{min-height:56px;background:#efe3ff;border-radius:12px;padding:10px 14px;font-size:18px;border:3px solid transparent}
.card.used{opacity:.25}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc{min-height:76px;border-radius:12px;background:#7e5bc0;color:#fff;font-size:18px;padding:6px}.mc.up{background:#fff;color:#2b2040;border:3px solid #b9a5e0}.mc.done{background:#c9f0c0;color:#2b2040}
.hot{position:absolute;border-radius:50%;border:3px dashed rgba(255,255,255,.0)}
.hot.show{border-color:rgba(255,255,255,.9);animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.15)}}
.home{text-align:center;color:#fff;padding:40px 10px}
.home h1{font-size:clamp(30px,6vw,52px);margin:10px 0}
.home .card2{display:inline-block;background:#fff8e7;color:#2b2040;border-radius:18px;padding:18px 26px;margin:10px}

  /* ====== 舞台 ====== */
  const Stage = {
    actors: {}, svg: null,
    mount(host, sc) {
      host.innerHTML = `<svg id="stage" viewBox="0 0 680 330" preserveAspectRatio="xMidYMax meet"><g id="bg">${BG[sc.bg]()}</g><g id="cast"></g><g id="fx"></g></svg>`;

        this.actors[id] = a; this.place(a, true); this.flip(a);

    },
    place(a, fast) {
      a.el.style.transition = fast ? 'none' : a.el.style.transition;

    },
    flip(a) { const f = $('.flip', a.el); if (f) { f.style.transformOrigin = '60px 0'; f.style.transform = `scaleX(${a.face})`; } },
    pulse(a, cls, ms) { a.el.classList.remove(cls); void a.el.getBoundingClientRect(); a.el.classList.add(cls); return wait(ms).then(() => a.el.classList.remove(cls)); },

          const nx = +args[0], ny = args[1] != null ? +args[1] : a.y, ns = args[2] != null ? +args[2] : a.s;
          const dx = Math.abs(nx - a.x)*6.8, dur = Math.max(400, dx/110*1000);

  /* ====== 關卡 ====== */
  const Levels = {
    run(cfg, host, done) {

        b.onclick = () => { if (o.ok) { b.classList.add('ok'); fb.innerHTML = '🌟 ' + T(o.why || '答對了!'); setTimeout(done, 1400); } else { b.classList.add('no'); fb.innerHTML = T(o.why || '再想一想,換一個試試。'); } };

    order(cfg, lb, fb, done) {
      const n = cfg.items.length, slots = document.createElement('div'), pool = document.createElement('div'); slots.className = 'slots'; pool.className = 'pool';
      lb.append(slots, pool); const picked = [];

      if (idx.every((v, i) => v === i)) idx.reverse();
      const draw = () => { slots.innerHTML = ''; for (let i = 0; i < n; i++) { const d = document.createElement('div'); d.className = 'slot'; d.innerHTML = picked[i] != null ? T(cfg.items[picked[i]]) : `第 ${i+1}`; if (picked[i] != null) d.onclick = () => { picked.splice(i); fb.textContent = ''; draw(); }; slots.appendChild(d); }

      const check = () => { if (picked.length < n) return; if (picked.every((v, i) => v === i)) { fb.innerHTML = '🌟 ' + T('順序對了!'); setTimeout(done, 1400); } else { fb.innerHTML = T(cfg.hint || '順序不太對,點一下格子重新排。'); } };

      lb.className = 'grid'; const cards = [];
      cfg.pairs.forEach((p, i) => { cards.push({ p: i, t: p[0] }, { p: i, t: p[1] }); });
      cards.sort((a, b) => ((a.t.charCodeAt(0) * 31) % 17) - ((b.t.charCodeAt(0) * 31) % 17));
      let first = null, lock = false, left = cfg.pairs.length;
      cards.forEach(c => { const b = document.createElement('button'); b.className = 'mc'; b.textContent = '?'; c.el = b;
        b.onclick = () => { if (lock || b.classList.contains('done') || b.classList.contains('up')) return; b.classList.add('up'); b.innerHTML = T(c.t);
          if (!first) { first = c; return; }
          if (first.p === c.p) { first.el.classList.replace('up', 'done'); b.classList.replace('up', 'done'); first = null; if (--left === 0) { fb.innerHTML = '🌟 ' + T('全部配對成功!'); setTimeout(done, 1400); } }
          else { lock = true; const f = first; first = null; setTimeout(() => { f.el.classList.remove('up'); f.el.textContent = '?'; b.classList.remove('up'); b.textContent = '?'; lock = false; }, 900); } };
        lb.appendChild(b); });
    },
    find(cfg, lb, fb, done) {
      const box = $('#stagebox'); const hs = [];
      lb.innerHTML = '<span>' + T('點一點畫面,找找看。') + '</span>';
      const clear = () => hs.forEach(h => h.remove());
      cfg.hotspots.forEach(h => { const d = document.createElement('div'); d.className = 'hot';
        const br = box.getBoundingClientRect(), r = Stage.actors[h.actor].el.getBoundingClientRect(), pad = 12;
        d.style.cssText = `left:${r.left - br.left - pad}px;top:${r.top - br.top - pad}px;width:${r.width + pad*2}px;height:${r.height + pad*2}px`;
        d.onclick = () => { if (h.ok) { fb.innerHTML = '🌟 ' + T(h.why || '找到了!'); clear(); setTimeout(done, 1400); } else { fb.innerHTML = T(h.why || '不是這個,再找找看。'); } };
        box.appendChild(d); hs.push(d); });
      setTimeout(() => hs.forEach(h => h.classList.add('show')), 15000);
    }
  };

  /* ====== 播放器 ====== */
  const Player = {
    S: null, si: 0, li: -1, busy: false,
    speak(t, k) {
      try {
        speechSynthesis.cancel();
        const p = VP[k] || VP._n, u = new SpeechSynthesisUtterance(t), v = pickVoice(p[0]);
        u.lang = 'zh-TW'; if (v) { u.voice = v; u.lang = v.lang; }
        u.pitch = p[1]; u.rate = p[2]; speechSynthesis.speak(u);
      } catch (e) {}
    },
    start(S, from) {
      this.S = S; const app = $('#app');
      app.innerHTML = `<div class="top"><button class="ghost" id="home">←</button><div class="dots" id="dots"></div></div><div id="stagebox"></div><div id="cap"></div><div id="lv" style="display:none"></div><div class="nav"><button class="ghost" id="prev">◀ 上一句</button><button id="next">再一句 ▶</button></div>`;
      $('#home').onclick = () => { try { speechSynthesis.cancel(); } catch (e) {} Home.show(); };
      $('#prev').onclick = () => this.prev(); $('#next').onclick = () => this.next();
      this.go(from || 0, 0);
    },
    dots() { $('#dots').innerHTML = this.S.scenes.map((_, i) => `<i class="${i < this.si ? 'on' : ''} ${i === this.si ? 'cur on' : ''}"></i>`).join(''); },
    async go(si, li) {
      this.busy = false; this.si = si; this.dots(); store.set('princess_' + this.S.id, si);
      Stage.mount($('#stagebox'), this.S.scenes[si]); $('#lv').style.display = 'none'; $('#cap').style.display = '';
      for (let j = 0; j < li; j++) await runActs(this.S.scenes[si].say[j][2], true);
      this.li = li - 1; if (li === 0 || li > 0) this.next();
    },
    async next() {
      if (this.busy) return; const sc = this.S.scenes[this.si];
      if (this.li + 1 >= sc.say.length) return this.endScene();
      this.li++; const [who, text, acts] = sc.say[this.li];
      const name = who === 'n' ? '' : `<span class="who">${(sc.cast[who] && sc.cast[who].name) || ''}</span><br>`;
      $('#cap').innerHTML = `${name}<div class="txt">${T(text)}</div>`; this.speak(text, who === 'n' ? null : (sc.cast[who] || {}).k);
      this.busy = true; await runActs(acts, false); this.busy = false;
    },
    prev() {
      if (this.busy) return;
      if (this.li > 0) this.go(this.si, this.li);
      else if (this.si > 0) this.go(this.si - 1, this.S.scenes[this.si - 1].say.length);
    },
    endScene() {
      const lv = (this.S.levels || {})[this.si];
      const after = () => { if (this.si + 1 < this.S.scenes.length) this.go(this.si + 1, 0); else Home.finish(this.S); };
      if (!lv) return after();
      $('#cap').style.display = 'none'; const host = $('#lv'); host.style.display = ''; Levels.run(lv, host, () => { $('#lv').style.display = 'none'; document.querySelectorAll('.hot').forEach(h => h.remove()); after(); });
    }
  };

  /* ====== 首頁 ====== */
  const Home = {
    show() {
      $('#app').innerHTML = `<div class="home"><div style="font-size:64px">👑</div><h1>公主故事屋</h1>${STORIES.map((S, i) => { const p = store.get('princess_' + S.id); return `<div class="card2"><h2>${S.title}</h2><p>${S.scenes.length} 幕故事・${Object.keys(S.levels || {}).length} 個小關卡</p><button data-go="${i}">從頭開始</button> ${p ? `<button class="ghost" data-cont="${i}">接著玩</button>` : ''}</div>`; }).join('')}</div>`;
      document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => Player.start(STORIES[+b.dataset.go], 0));
      document.querySelectorAll('[data-cont]').forEach(b => b.onclick = () => { const S = STORIES[+b.dataset.cont]; Player.start(S, store.get('princess_' + S.id) || 0); });
    },
    finish(S) { $('#app').innerHTML = `<div class="home"><div style="font-size:64px">🌟</div><h1>故事結束了</h1><div class="card2"><p>${T('你陪著' + S.title + '走完了整個故事!')}</p><p>${T(S.parent || '')}</p><button id="again">再玩一次</button></div></div>`; $('#again').onclick = () => Home.show(); }
  };
  window.__open = (si, li, st) => { Player.start(STORIES[st || 0], 0); Player.go(si, li || 0); };
  window.__stories = STORIES;
  const hm = location.hash.match(/#(\d+),(\d+)(?:,(\d+))?/);
  if (hm) { try { speechSynthesis.speak = () => {}; } catch (e) {} window.__open(+hm[1], +hm[2], +(hm[3] || 0)); } else Home.show();
})();
</script></body></html>
