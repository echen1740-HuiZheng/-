.lift .armL{transform:rotate(150deg);transform-origin:38px 88px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

          a.el.style.opacity = 0; b.el.style.opacity = 1; return wait(700);
        }
        case 'face': a.el.classList.remove('ex-sad', 'ex-wow', 'ex-angry', 'ex-sleep'); if (args[0] && args[0] !== 'none') a.el.classList.add('ex-' + args[0]); return Promise.resolve();
        case 'turn': a.face = args[0] ? +args[0] : -a.face; this.flip(a, fast); return done(320);
        case 'stand': a.el.classList.remove('crouchd', 'fallen'); return done(500);
        case 'crouch': a.el.classList.add('crouchd'); return done(500);
        case 'fall': a.el.classList.add('fallen'); return done(900);
        case 'emo': if (!fast) this.bubble(a, args.join(' ')); return Promise.resolve();
        case 'nod': case 'wave': case 'blink': case 'jump': case 'knock': case 'shiver': case 'lift':
          return fast ? Promise.resolve() : this.pulse(a, verb, verb === 'lift' ? 1500 : verb === 'shiver' ? 1400 : 1000);
        case 'fear': if (fast) return Promise.resolve(); this.bubble(a, '😨'); return this.pulse(a, 'fear', 1000);
        case 'point': if (fast) return Promise.resolve(); return this.pulse(a, 'point', 1200);
        case 'spin': case 'bow': case 'clap': case 'hug': case 'laugh': case 'no':
          return fast ? Promise.resolve() : this.pulse(a, verb, { spin: 900, bow: 1200, clap: 1200, hug: 1600, laugh: 1350, no: 900 }[verb]);
        case 'think': if (fast) return Promise.resolve(); this.bubble(a, '💭'); return this.pulse(a, 'think', 1800);
        case 'cry': if (fast) return Promise.resolve(); return this.pulse(a, 'cry', 2100);
      }
      return Promise.resolve();
    }
  };
  /* 動作字串:「角色 動詞 參數 @毫秒」或「@字幕裡的字」(念到那個字時才動) */
  const parseAct = s => { const m = s.trim().match(/^(.*?)(?:\s+@(\S+))?$/), p = m[1].split(/\s+/); return { id: p[0], verb: p[1], args: p.slice(2), at: m[2] || '0' }; };
  const delayOf = (at, zh, cur, est) => {
    if (/^\d+$/.test(at)) return +at;
    const [mk, plus] = at.split('+'), [mz, me] = mk.split('|'), extra = +(plus || 0);
    let r = -1;
    if (CUR === 'en' && me) { const i = cur.toLowerCase().indexOf(me.toLowerCase()); if (i >= 0) r = i / Math.max(1, cur.length); }
    if (r < 0) { const i = zh.indexOf(mz); r = i < 0 ? 0 : i / Math.max(1, zh.length); }
    return Math.round(r * (est - 400) + 200) + extra;
  };
  async function runActs(acts, fast, zh = '', cur = '', est = 0) {
    const gen = MOUNT;  // 換場後,上一幕還沒跑完的動作就作廢
    const ps = (acts || []).map(parseAct).map(a => wait(fast ? 0 : delayOf(a.at, zh, cur, est)).then(() => gen === MOUNT ? Stage.act(a.id, a.verb, a.args, fast) : null));
    return Promise.all(ps);
  }

  /* ====== 關卡:全部用圖案,題目會念出來,點到的卡片也會念名字 ====== */
  const pic = o => o.a ? `<svg class="pic" viewBox="-6 -14 132 204">${build({ k: o.a }).html}</svg>` : `<span class="emo">${o.p || '❓'}</span>`;
  const card = (o, cls) => `<button class="pcard ${cls || ''}">${pic(o)}${o.t ? `<span class="lbl">${T(tx(o.t))}</span>` : ''}</button>`;
  const say = t => { try { Player.speak(t, null, estMs(t, null)); } catch (e) {} };
  /* 每個故事、每一關的排列都不同,但同一關每次一樣(固定種子洗牌) */
  const mix = (n, seed) => { const idx = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(RND(seed * 13 + i) * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (idx.every((v, i) => v === i)) idx.push(idx.shift()); return idx; };
  /* 角色圖自動放大到剛好填滿卡片 */
  const fitPics = root => root.querySelectorAll('svg.pic:not([data-fit])').forEach(sv => { try { const b = sv.querySelector('.body').getBBox(), m = 6, w = Math.max(b.width, b.height * .62) + m * 2, cx = b.x + b.width / 2; sv.setAttribute('viewBox', `${cx - w / 2} ${b.y - m} ${w} ${b.height + m * 2}`); sv.dataset.fit = 1; } catch (e) {} });
  const wiggle = el => { el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); };
  const Levels = {
    run(cfg, host, done, seed) {
      this.seed = seed || 0; const q = tx(cfg.q);
      host.innerHTML = `<h3><button class="ghost say" title="再聽一次">🔊</button> ${T(q)}</h3><div id="lb"></div><div class="fb" id="fb"></div>`;
      $('.say', host).onclick = () => say(q); say(q);
      const lb = $('#lb', host), fb = $('#fb', host);
      const win = (msg) => { fb.innerHTML = '<span class="star">🌟</span> ' + T(msg); say(msg); setTimeout(done, 1900); };
      const hint = (msg) => { fb.innerHTML = T(msg); say(msg); };
      (this[cfg.type] || this.pick).call(this, cfg, lb, win, hint); fitPics(lb);
    },
    /* 選一張圖 */
    pick(cfg, lb, win, hint) {
      lb.className = 'pcards';
      mix(cfg.opts.length, this.seed).map(i => cfg.opts[i]).forEach(o => { const d = document.createElement('div'); d.innerHTML = card(o); const b = d.firstChild; lb.appendChild(b);
        b.onclick = () => { if (lb.dataset.done) return;
          if (o.ok) { lb.dataset.done = 1; b.classList.add('ok'); win(tx(o.why) || U('ok')); }
          else { wiggle(b); b.classList.add('no'); hint(tx(o.why) || U('again')); } }; });
    },
    /* 照故事順序點三張圖 */
    order(cfg, lb, win, hint) {
      const n = cfg.items.length; let next = 0;
      lb.innerHTML = `<div class="oslots">${cfg.items.map((_, i) => `<div class="oslot"><b>${i + 1}</b></div>`).join('<span class="arr">➜</span>')}</div><div class="pcards"></div>`;
      const slots = lb.querySelectorAll('.oslot'), pool = lb.querySelector('.pcards');
      mix(n, this.seed + 1).forEach(i => { const o = cfg.items[i], d = document.createElement('div'); d.innerHTML = card(o); const b = d.firstChild; pool.appendChild(b);
        b.onclick = () => { if (b.classList.contains('used')) return;
          if (i === next) { b.classList.add('used'); slots[next].innerHTML = pic(o); fitPics(slots[next]); slots[next].classList.add('ok'); say(tx(o.t) || ''); next++; if (next === n) win(U('orderOk')); }
          else { wiggle(b); hint(next === 0 ? U('first') : U('nextOne')); } }; });
    },
    /* 把角色和他的東西配起來 */
    pair(cfg, lb, win, hint) {
      lb.innerHTML = `<div class="pcols"><div class="pcol L"></div><div class="pcol R"></div></div>`;
      const L = lb.querySelector('.L'), R = lb.querySelector('.R'); let sel = null, left = cfg.pairs.length;
      const mk = (o, side, i) => { const d = document.createElement('div'); d.innerHTML = card(o, 'small'); const b = d.firstChild; b.dataset.i = i; b.dataset.side = side; return b; };
      cfg.pairs.forEach((p, i) => L.appendChild(mk(p[0], 'L', i)));
      mix(cfg.pairs.length, this.seed + 2).forEach(i => R.appendChild(mk(cfg.pairs[i][1], 'R', i)));
      lb.querySelectorAll('.pcard').forEach(b => b.onclick = () => {
        if (b.classList.contains('ok')) return;
        const o = cfg.pairs[+b.dataset.i][b.dataset.side === 'L' ? 0 : 1]; if (o.t) say(tx(o.t));
        if (!sel || sel.dataset.side === b.dataset.side) { if (sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
        if (sel.dataset.i === b.dataset.i) { sel.classList.replace('sel', 'ok'); b.classList.add('ok'); sel = null; if (--left === 0) win(U('matchOk')); }
        else { wiggle(b); wiggle(sel); sel.classList.remove('sel'); sel = null; hint(U('tryPair')); }
      });
    },
    /* 在畫面上點角色 */
    find(cfg, lb, win, hint) {
      const box = $('#stagebox'); const hs = []; box.querySelectorAll('.hot').forEach(h => h.remove());
      lb.innerHTML = '<p class="tip">👆 ' + T(U('tap')) + '</p>';
      const clear = () => hs.forEach(h => h.remove());
      cfg.hotspots.forEach(h => { const d = document.createElement('div'); d.className = 'hot';
        const br = box.getBoundingClientRect(), r = Stage.actors[h.actor].el.getBoundingClientRect(), pad = 12;
        d.style.cssText = `left:${r.left - br.left - pad}px;top:${r.top - br.top - pad}px;width:${r.width + pad*2}px;height:${r.height + pad*2}px`;
        d.onclick = () => { if (h.ok) { clear(); win(tx(h.why) || U('found')); } else { wiggle(d); hint(tx(h.why) || U('notIt')); } };
        box.appendChild(d); hs.push(d); });
      setTimeout(() => hs.forEach(h => h.classList.add('show')), 6000);
    }
  };
  Levels.choose = Levels.pick; Levels.match = Levels.pair;

  /* 這一句的鏡頭要框誰:有人說話 → 說話的人+這句裡被動到的角色;旁白 → 只有一個角色在表演情緒時才特寫 */
  const shotOf = (who, acts, after) => {
    const ps = (acts || []).map(parseAct), ids = new Set(), dest = [];
    ps.forEach(p => { if (p.id === 'fx' || p.id === 'cam') p.args.forEach(r => { const id = String(r).split('.')[0]; if (Stage.actors[id]) ids.add(id); }); else if (Stage.actors[p.id]) { ids.add(p.id); if (p.verb === 'swap' && Stage.actors[p.args[0]]) ids.add(p.args[0]);
      /* 走路的人:目的地也要框進來,才不會走出畫面 */
      const a = Stage.actors[p.id]; if (after) return; if (['pop', 'show'].includes(p.verb)) dest.push({ x: a.x, y: a.y, s: a.s });
      if (['go', 'run', 'glide'].includes(p.verb)) dest.push({ x: +p.args[0], y: p.args[1] != null ? +p.args[1] : a.y, s: p.args[2] != null ? +p.args[2] : a.s }); } });
    if (who !== 'n') return Stage.actors[who] ? [who, ...[...ids].filter(i => i !== who), ...dest] : [];
    /* 天氣、爆炸這類全畫面特效要看全景 */
    if (ps.some(p => p.id === 'fx' && WIDEFX.includes(p.verb))) return [];
    const one = [...ids];
    return one.length && one.length <= 3 ? [...one, ...dest] : [];
  };
  const WIDEFX = ['snow', 'storm', 'winter', 'thaw', 'sweep', 'lanterns', 'confetti', 'shake', 'flash', 'dim', 'boom', 'lightning', 'rain', 'night', 'sea', 'ice', 'freeze'];
  /* ====== 播放器 ====== */
  const Player = {
    S: null, si: 0, li: -1, busy: false, lvTok: 0,
    /* 念完(或估計時間到)才放行下一句,避免小朋友一直點把聲音切掉 */
    speak(t, k, est) {
      return new Promise(res => {
        const end = () => res(); setTimeout(end, est + 1500);
        try {
          speechSynthesis.cancel();
          const p = VP[k] || VP._n, u = new SpeechSynthesisUtterance(t), v = pickVoice(p[0]);
          u.lang = CUR === 'en' ? 'en-US' : 'zh-TW'; if (v) { u.voice = v; u.lang = v.lang; }
          u.pitch = p[1]; u.rate = p[2]; u.onend = end; u.onerror = end; speechSynthesis.speak(u);
          if (STILL) setTimeout(end, 50);
        } catch (e) { end(); }
      });
    },
    start(S, from, li) {
      this.S = S; CUR = LANG === 'en' && hasEn(S) ? 'en' : 'zh'; const app = $('#app');
      app.innerHTML = `<div class="top"><button class="ghost" id="home">←</button><div class="dots" id="dots"></div>${langBtn()}</div><div id="stagebox"></div><div id="cap"></div><div id="lv" style="display:none"></div><div class="nav"><button class="ghost" id="prev">${U('prev')}</button><button id="next">${U('next')}</button></div>`;
      $('#home').onclick = () => { this.lvTok++; try { speechSynthesis.cancel(); } catch (e) {} Home.show(); };
      $('#prev').onclick = () => this.prev(); $('#next').onclick = () => this.next();
      $('#lang').onclick = () => { setLang(LANG === 'en' ? 'zh' : 'en'); const si = this.si, li = Math.max(0, this.li), lv = $('#lv').style.display !== 'none';
        try { speechSynthesis.cancel(); } catch (e) {} this.start(this.S, si, lv ? this.S.scenes[si].say.length : li); };
      this.go(from || 0, li || 0);
    },
    dots() { $('#dots').innerHTML = this.S.scenes.map((_, i) => `<i class="${i < this.si ? 'on' : ''} ${i === this.si ? 'cur on' : ''}"></i>`).join(''); },
    async go(si, li) {
      this.lvTok++; const nav = $('.nav'); if (nav) nav.style.visibility = '';
      this.busy = false; this.si = si; this.dots(); store.set('princess_' + this.S.id, si);
      Stage.mount($('#stagebox'), this.S.scenes[si], li === 0); $('#lv').style.display = 'none'; $('#cap').style.display = '';
      for (let j = 0; j < li; j++) await runActs(this.S.scenes[si].say[j][2], true);
      this.li = li - 1; if (li === 0 || li > 0) this.next();
    },
    async next() {
      if (this.busy) return; const sc = this.S.scenes[this.si];
      if (this.li + 1 >= sc.say.length) return this.endScene();
      this.li++; const [who, raw, acts] = sc.say[this.li], text = tx(raw), zh = zhOf(raw);
      const name = who === 'n' ? '' : `<span class="who">${esc(tx(sc.cast[who] && sc.cast[who].name) || '')}</span><br>`;
      $('#cap').innerHTML = `${name}<div class="txt">${T(text)}</div>`;
      const k = who === 'n' ? null : (sc.cast[who] || {}).k, est = estMs(text, k), sp = this.speak(text, k, est), spk = Stage.actors[who];
      if (spk) { spk.el.classList.add('talking'); setTimeout(() => spk.el.classList.remove('talking'), est); }
      Stage.camLock = false; const shot = after => { if (!Stage.camLock) Stage.cam(shotOf(who, acts, after), who === 'n' ? 1.25 : 1.35, STILL); };
      shot(); const gen = MOUNT;
      this.busy = true; await Promise.all([runActs(acts, STILL, zh, text, est).then(() => { if (gen === MOUNT) shot(true); }), sp]); this.busy = false;
    },
    prev() {
      if (this.busy) return;
      if (this.li > 0) this.go(this.si, this.li);
      else if (this.si > 0) this.go(this.si - 1, this.S.scenes[this.si - 1].say.length);
    },
    endScene() {
      const lv = (this.S.levels || {})[this.si];
      const after = () => { if (this.si + 1 < this.S.scenes.length) this.go(this.si + 1, 0); else Home.finish(this.S); };
      if (!lv) return after();
      /* 關卡進行中藏起上一句/再一句;過關只算一次,中途換頁或換語言就作廢 */
      const tok = ++this.lvTok, seed = [...this.S.id].reduce((a, c) => a + c.charCodeAt(0), 0) + this.si * 7 + 8;
      Stage.camLock = true; Stage.cam([], 1, true);
      $('#cap').style.display = 'none'; $('.nav').style.visibility = 'hidden'; const host = $('#lv'); host.style.display = '';
      Levels.run(lv, host, () => { if (tok !== this.lvTok) return; this.lvTok++; $('#lv').style.display = 'none'; $('.nav').style.visibility = ''; document.querySelectorAll('.hot').forEach(h => h.remove()); after(); }, seed);
    }
  };

  /* ====== 首頁 ====== */
  const Home = {
    show() { clearInterval(Stage.blinker);
      CUR = LANG;
      $('#app').innerHTML = `<div class="home"><div class="hometop">${langBtn()}</div><div style="font-size:64px">👑</div><h1>${U('home')}</h1>${STORIES.map((S, i) => { const p = store.get('princess_' + S.id); return `<div class="card2"><h2>${esc(tx(S.title))}</h2>${LANG === 'en' && !hasEn(S) ? `<p class="zhonly">${U('zhOnly')}</p>` : ''}<p>${U('scenes')(S.scenes.length, Object.keys(S.levels || {}).length)}</p><button data-go="${i}">${U('start')}</button> ${p ? `<button class="ghost" data-cont="${i}">${U('cont')}</button>` : ''}</div>`; }).join('')}</div>`;
      $('#lang').onclick = () => { setLang(LANG === 'en' ? 'zh' : 'en'); this.show(); };
      document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => Player.start(STORIES[+b.dataset.go], 0));
      document.querySelectorAll('[data-cont]').forEach(b => b.onclick = () => { const S = STORIES[+b.dataset.cont]; Player.start(S, store.get('princess_' + S.id) || 0); });
    },
    finish(S) { clearInterval(Stage.blinker); $('#app').innerHTML = `<div class="home"><div style="font-size:64px">🌟</div><h1>${U('end')}</h1><div class="card2"><p>${T(U('endMsg')(tx(S.title)))}</p><p>${T(tx(S.parent) || '')}</p><button id="again">${U('replay')}</button></div></div>`; $('#again').onclick = () => Home.show(); }
  };
  window.__open = (si, li, st) => Player.start(STORIES[st || 0], si, li || 0);
  window.__stories = STORIES; window.__test = { Stage, runActs, estMs, Levels, BG, PROP, OPT, build };
  const hm = location.hash.match(/#(\d+),(\d+)(?:,(\d+))?(?:,(en|zh))?/);
  if (hm && hm[4]) { LANG = hm[4]; CUR = LANG; }
  const hmOk = hm && STORIES[+(hm[3] || 0)] && STORIES[+(hm[3] || 0)].scenes[+hm[1]];  // 網址數字不存在就回首頁
  if (hmOk) { STILL = true; document.body.classList.add('still'); try { speechSynthesis.speak = () => {}; } catch (e) {} window.__open(+hm[1], +hm[2], +(hm[3] || 0)); } else Home.show();
})();
</script></body></html>
