.running:not(.jump):not(.fear):not(.shiver) .body{animation:rb .28s ease-in-out infinite;transform-origin:60px 182px}

    finish(S) { clearInterval(Stage.blinker); $('#app').innerHTML = `<div class="home"><div style="font-size:64px">🌟</div><h1>${U('end')}</h1><div class="card2"><p>${T(U('endMsg')(tx(S.title)))}</p><p>${T(tx(S.parent) || '')}</p><button id="again">${U('replay')}</button></div></div>`; $('#again').onclick = () => Home.show(); }
  };
  window.__open = (si, li, st) => Player.start(STORIES[st || 0], si, li || 0);
  window.__stories = STORIES; window.__test = { Stage, runActs, estMs, Levels, BG, PROP, OPT, build };
  const hm = location.hash.match(/#(\d+),(\d+)(?:,(\d+))?(?:,(en|zh))?/);
  if (hm && hm[4]) { LANG = hm[4]; CUR = LANG; }
  const hmOk = hm && STORIES[+(hm[3] || 0)] && STORIES[+(hm[3] || 0)].scenes[+hm[1]];  // 網址數字不存在就回首頁
  if (hmOk) { STILL = true; document.body.classList.add('still'); try { speechSynthesis.speak = () => {}; } catch (e) {} window.__open(+hm[1], +hm[2], +(hm[3] || 0)); } else Home.show();
})();
</script></body></html>
